name: Publish public CLI archive
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Desktop packages run containing the tested CLI archive
        required: true
      commit_sha:
        description: Exact 40-character source commit SHA
        required: true
      version:
        description: Stable CLI package version
        required: true
permissions:
  actions: read
  contents: write
concurrency:
  group: public-cli-release
  cancel-in-progress: false
jobs:
  publish:
    permissions:
      actions: read
      contents: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: desktop-release
    env:
      RUN_ID: ${{ inputs.run_id }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      CLI_VERSION: ${{ inputs.version }}
      RELEASE_REPOSITORY: elliotshohet/freecoda
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate successful main source and download its tested archive
        run: |
          python3 - <<'PY'
          import os,re,json,subprocess,base64
          def api(path): return json.loads(subprocess.check_output(['gh','api',path]))
          run_id=os.environ['RUN_ID']; sha=os.environ['SOURCE_SHA']; version=os.environ['CLI_VERSION']
          assert re.fullmatch(r'[0-9]+',run_id), 'Invalid run ID'
          assert re.fullmatch(r'[0-9a-f]{40}',sha), 'Use the full source SHA'
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',version), 'Stable semver required'
          repo=os.environ['GITHUB_REPOSITORY']; run=api(f'repos/{repo}/actions/runs/{run_id}')
          assert run['conclusion']=='success' and run['head_sha']==sha and run['head_branch']=='main' and run['event']=='push', 'Source run must pass at this exact main SHA'
          assert run['path']=='.github/workflows/desktop.yml', 'Wrong source workflow'
          package=api(f'repos/{repo}/contents/packages/cli/package.json?ref={sha}')
          assert json.loads(base64.b64decode(package['content']))['version']==version, 'CLI source version mismatch'
          checks=api(f'repos/{repo}/actions/workflows/checks.yml/runs?head_sha={sha}&event=push&per_page=10')['workflow_runs']
          assert any(c['conclusion']=='success' and c['head_branch']=='main' for c in checks), 'Matching Checks workflow must pass'
          name=f"freecoda-cli-unpublished-{run['run_number']}"
          subprocess.run(['gh','run','download',run_id,'--repo',repo,'--name',name,'--dir','incoming-cli'],check=True)
          PY
      - name: Test archive validation and validate exact package contents
        run: |
          python3 scripts/release/test-prepare-cli.py
          python3 scripts/release/prepare-cli.py incoming-cli public-cli "$CLI_VERSION"
      - name: Publish archive without changing the desktop latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$GH_TOKEN" || { echo 'The canonical repository release token is required'; exit 1; }
          tag="cli-v$CLI_VERSION"
          if gh release view "$tag" --repo "$RELEASE_REPOSITORY" --json isDraft,body > existing-cli.json; then
            python3 -c 'import json,os; r=json.load(open("existing-cli.json")); assert r["isDraft"], "Published archives are immutable; use a new version"; assert "Source commit: "+os.environ["SOURCE_SHA"]+"." in r["body"], "Draft belongs to a different source"'
          else
            gh release create "$tag" --repo "$RELEASE_REPOSITORY" --draft --title "Freecoda CLI $CLI_VERSION" --notes "Freecoda CLI $CLI_VERSION. Source commit: $SOURCE_SHA. General chat is the default, without repository tools or automatic project context. Coding modes remain available with explicit repository trust; conversations are separated by mode. Free forever, supported by labeled sponsors. Verify SHA256SUMS.txt before installation. Install the attached archive with npm install --global /path/to/freecoda-$CLI_VERSION.tgz --ignore-scripts. This is a public GitHub archive release; npm registry publication remains separate."
          fi
          gh release upload "$tag" public-cli/* --repo "$RELEASE_REPOSITORY" --clobber
          gh api --paginate --slurp "repos/$RELEASE_REPOSITORY/releases?per_page=100" > uploaded-cli-pages.json
          python3 - <<'PYJSON'
          import json,os
          releases=[r for page in json.load(open('uploaded-cli-pages.json')) for r in page]
          release=next(r for r in releases if r['tag_name']=='cli-v'+os.environ['CLI_VERSION'])
          assert release['draft'], 'Expected the validated draft release'
          json.dump(release,open('uploaded-cli.json','w'))
          PYJSON
          python3 - <<'PY'
          import os,json,pathlib,hashlib
          assets=json.load(open('uploaded-cli.json'))['assets']
          expected={p.name:p for p in pathlib.Path('public-cli').iterdir()}
          assert len(assets)==len(expected)==2, 'Exactly package and checksum assets required'
          for a in assets:
            p=expected[a['name']]
            assert a['size']==p.stat().st_size and a['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest(), 'Uploaded bytes do not match validated package'
          PY
          gh release edit "$tag" --repo "$RELEASE_REPOSITORY" --draft=false --latest=false
          echo "Public archive published; npm registry and desktop latest release unchanged."
