name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  # Native binaries are tested in Desktop packages, not compiler/CLI checks.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: freecoda
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: freecoda_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U freecoda -d freecoda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://freecoda:ci-only-password@127.0.0.1:5432/freecoda_test
      AD_SIGNING_SECRET: ci-only-ad-signing-secret-32-characters
      HOSTED_INFERENCE_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun scripts/migrate.ts
      - run: node --check apps/desktop/scripts/qualify-upgrade.mjs
      - run: node --test apps/desktop/scripts/upgrade-version.test.mjs
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:integration
      - run: bun run build
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run build:cli
      - run: node packages/cli/dist/index.js --help
