name: Desktop packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/core/**"
      - "packages/contracts/**"
      - "packages/cli/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop.yml"
      - "tests/desktop-*.test.ts"
      - "tests/bundled-notices.test.ts"
      - "scripts/bundled-notices.ts"
      - "legal/**"
      # This harness runs against published binaries in desktop-upgrade.yml.
      - "!apps/desktop/scripts/qualify-upgrade.mjs"
      - "!apps/desktop/scripts/upgrade-version.mjs"
      - "!apps/desktop/scripts/upgrade-version.test.mjs"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/core/**"
      - "packages/contracts/**"
      - "packages/cli/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop.yml"
      - "tests/desktop-*.test.ts"
      - "tests/bundled-notices.test.ts"
      - "scripts/bundled-notices.ts"
      - "legal/**"
      # This harness runs against published binaries in desktop-upgrade.yml.
      - "!apps/desktop/scripts/qualify-upgrade.mjs"
      - "!apps/desktop/scripts/upgrade-version.mjs"
      - "!apps/desktop/scripts/upgrade-version.test.mjs"
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            targets: AppImage deb
            extensions: '[".AppImage",".deb"]'
          - os: windows-2022
            platform: win
            arch: x64
            targets: nsis
            extensions: '[".exe"]'
          - os: macos-15-intel
            platform: mac
            arch: x64
            targets: dmg zip
            extensions: '[".dmg",".zip"]'
          - os: macos-15
            platform: mac
            arch: arm64
            targets: dmg zip
            extensions: '[".dmg",".zip"]'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      EXPECTED_EXTENSIONS: ${{ matrix.extensions }}
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.DESKTOP_MAC_CERTIFICATE_P12 || matrix.platform == 'win' && secrets.DESKTOP_WINDOWS_CERTIFICATE_PFX || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.DESKTOP_MAC_CERTIFICATE_PASSWORD || matrix.platform == 'win' && secrets.DESKTOP_WINDOWS_CERTIFICATE_PASSWORD || '' }}
      APPLE_ID: ${{ matrix.platform == 'mac' && secrets.DESKTOP_APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.DESKTOP_APPLE_APP_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.DESKTOP_APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run desktop:typecheck
      - run: node --test apps/desktop/scripts/verify-signing.test.mjs
      - run: bun test tests/desktop-security.test.ts tests/desktop-local-agent.test.ts tests/desktop-updater.test.ts tests/desktop-packaging.test.ts tests/shell-platform.test.ts
      - run: bun run desktop:build
      - name: Install native Electron runtime for smoke
        run: node -e 'const p=require("node:path"); const f=require.resolve("electron/package.json",{paths:[p.resolve("apps/desktop")]}); require(p.join(p.dirname(f),"install.js"));'
      - name: Native runtime smoke (macOS and Windows)
        if: runner.os != 'Linux'
        run: node apps/desktop/scripts/smoke.mjs
      - name: Native runtime smoke (Linux sandbox)
        if: runner.os == 'Linux'
        run: |
          sandbox_binary=$(node -e 'const p=require("node:path");const f=require.resolve("electron/package.json",{paths:[p.resolve("apps/desktop")]});console.log(p.join(p.dirname(f),"dist","chrome-sandbox"));')
          sudo chown root:root "$sandbox_binary"
          sudo chmod 4755 "$sandbox_binary"
          xvfb-run -a node apps/desktop/scripts/smoke.mjs
      - name: Validate optional signing configuration
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            test -n "$CSC_KEY_PASSWORD" || { echo 'Signing certificate password is required'; exit 1; }
            if [ "$PLATFORM" = mac ]; then
              test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo 'Developer ID signing requires Apple notarization credentials'; exit 1; }
            fi
            echo 'Signing enabled; build must produce a signed installer.'
          else
            test -z "$CSC_KEY_PASSWORD$APPLE_ID$APPLE_APP_SPECIFIC_PASSWORD$APPLE_TEAM_ID" || { echo 'Partial signing configuration: certificate is missing'; exit 1; }
            echo 'No signing identity configured: producing explicitly unsigned installers.'
          fi
      - name: Package without publishing
        run: |
          signing=()
          if [ -n "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            signing+=(--config.forceCodeSigning=true)
          else
            # electron-builder treats an empty CSC_LINK as a path to cwd.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          bun run desktop:package -- --${{ matrix.platform }} ${{ matrix.targets }} --${{ matrix.arch }} "${signing[@]}"
      - name: Verify packaged signatures and notarization
        env:
          SIGNING_PLATFORM: ${{ matrix.platform }}
          SIGNING_ARCH: ${{ matrix.arch }}
          SIGNING_CONFIGURED: ${{ env.CSC_LINK != '' }}
        run: node apps/desktop/scripts/verify-signing.mjs
      - name: Preserve signing verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signing-verification-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_number }}
          path: apps/desktop/release/signing-verification-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify requested formats and calculate SHA-256
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import path from 'node:path';
          const directory = 'apps/desktop/release';
          const extensions = JSON.parse(process.env.EXPECTED_EXTENSIONS);
          const entries = await readdir(directory, { withFileTypes: true });
          const files = entries.filter(entry => entry.isFile() && extensions.some(extension => entry.name.endsWith(extension))).map(entry => entry.name).sort();
          for (const extension of extensions) {
            if (!files.some(file => file.endsWith(extension))) throw new Error(`Missing desktop package format: ${extension}`);
          }
          const checksums = [];
          for (const file of files) {
            const digest = createHash('sha256').update(await readFile(path.join(directory, file))).digest('hex');
            checksums.push(`${digest}  ${file}`);
          }
          await writeFile(path.join(directory, 'SHA256SUMS.txt'), checksums.join('\n') + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: freecoda-desktop-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  cli-package:
    name: CLI tarball (unpublished)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run build:cli
      - name: Pack locally without publishing
        run: |
          mkdir -p ../../.data/cli-release
          npm pack --ignore-scripts --pack-destination ../../.data/cli-release
        working-directory: packages/cli
      - name: Smoke-test standalone installation
        run: |
          npm install --prefix .data/cli-install --ignore-scripts --no-audit --no-fund ./.data/cli-release/freecoda-*.tgz
          node .data/cli-install/node_modules/freecoda/bin/freecoda.js --help
          cd .data/cli-release
          sha256sum *.tgz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: freecoda-cli-unpublished-${{ github.run_number }}
          path: .data/cli-release/*
          if-no-files-found: error
          retention-days: 14
